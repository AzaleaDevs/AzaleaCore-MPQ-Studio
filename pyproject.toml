[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "azaleacore-mpq-studio"
version = "0.8.0"
description = "Herramienta segura de exploración, extracción y creación de archivos MPQ."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AzaleaDevs" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
azaleacore-mpq-studio = "azaleacore_mpq_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

